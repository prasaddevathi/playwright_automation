name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run against'
        required: true
        default: 'qa'
        type: choice
        options: [qa, stage]

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      CI: true
      ENV: ${{ github.event.inputs.environment || 'qa' }}
      BASE_URL: ${{ secrets.QA_BASE_URL }}
      API_URL: ${{ secrets.QA_API_URL }}
      USERNAME: ${{ secrets.QA_USERNAME }}
      PASSWORD: ${{ secrets.QA_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Lint
        run: npm run lint

      - name: Run smoke tests (PRs) / full regression (main)
        run: npx playwright test --grep ${{ github.event_name == 'pull_request' && '@smoke' || '@regression' }}

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: reports/html
          retention-days: 14

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-junit-report
          path: reports/junit
          retention-days: 14

  # SauceDemo is a public app, so this job needs no secrets and gives a
  # real, always-runnable signal on every push and PR.
  saucedemo:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Type check
        run: npm run typecheck

      - name: Run SauceDemo suite (Chromium)
        run: npm run test:saucedemo

      - name: Upload HTML report and execution logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saucedemo-report
          path: |
            reports/html
            reports/logs
          retention-days: 14
